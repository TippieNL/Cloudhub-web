name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the minimum the README supports; 8.4 is current.
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, zip, pdo_mysql, fileinfo
          coverage: none

      - name: Syntax-check every PHP source file
        run: git ls-files '*.php' -z | xargs -0 -n1 -P4 php -l

      # tests/run.php needs no database, framework or Composer install, and
      # exits non-zero when any check script fails or emits a diagnostic.
      # This is also what keeps the hygiene checks honest: phase14 asserts that
      # the unauthenticated storage-check.php and the orphan player
      # stylesheets stay deleted, so their return fails the build.
      - name: Run the check suite
        run: php tests/run.php
